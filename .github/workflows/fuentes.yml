# Cada lunes por la noche baja las fuentes de OpenStreetMap y las deja listas para Ichnos
name: Fuentes
on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fuentes.py
      - run: |
          git config user.name "ichnos-bot"
          git config user.email "ichnos-bot@users.noreply.github.com"
          git add datos/fuentes
          git diff --cached --quiet || (git commit -m "Fuentes actualizadas (OpenStreetMap)" && git pull --rebase && git push)
