# Sube solo el puente de Ichnos a Cloudflare cada vez que cambia worker/worker.js
name: Puente a Cloudflare
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/puente.yml']
  workflow_dispatch:
jobs:
  subir:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Comprobar la llave
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Falta el secreto CLOUDFLARE_API_TOKEN en GitHub"; exit 1; fi
      - name: Preparar la configuración (busca el espacio KV de Ichnos)
        run: |
          npx -y wrangler@3 kv namespace list > ns.json
          KV_ID=$(node -e "const l=require('./ns.json'); const n=l.find(x=>/ichnos/i.test(x.title))||l[0]; if(!n){process.exit(1)} console.log(n.id)")
          cat > worker/wrangler.toml <<TOML
          name = "ichnos-strava"
          main = "worker.js"
          compatibility_date = "2025-01-01"
          workers_dev = true
          keep_vars = true
          [[kv_namespaces]]
          binding = "KV"
          id = "$KV_ID"
          TOML
          sed -i 's/^ *//' worker/wrangler.toml
          cat worker/wrangler.toml
      - name: Subir el puente
        working-directory: worker
        run: npx -y wrangler@3 deploy
